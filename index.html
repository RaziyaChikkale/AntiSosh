<!DOCTYPE html>
<html lang="en">
<head>
    <style>
        #z {
            width: 20px;
            height: 20px;
            position: relative;
            left: 30%;
            bottom: 45px;
        }
    </style>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <link rel="icon" href="antisoshicon.jpg" type="image/jpg">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
    <title>AntiSosh.net - Login</title>
    <script type="module">
        import { initializeApp } from 'https://www.gstatic.com/firebasejs/9.6.1/firebase-app.js';
        import { getAuth, signInWithEmailAndPassword } from 'https://www.gstatic.com/firebasejs/9.6.1/firebase-auth.js';
        import { getDatabase } from 'https://www.gstatic.com/firebasejs/9.6.1/firebase-database.js';

        const firebaseConfig = {
            apiKey: "AIzaSyDsW6xPgFEMhLvwjg79oFr5EPkY7VmkN1A",
            authDomain: "antisosh-391d5.firebaseapp.com",
            databaseURL: "https://antisosh-391d5-default-rtdb.firebaseio.com",
            projectId: "antisosh-391d5",
            storageBucket: "antisosh-391d5.appspot.com",
            messagingSenderId: "838183265361",
            appId: "1:838183265361:web:f77878cd25202c42108470"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const database = getDatabase(app);

        window.myFunction = function() {
            const passwordInput = document.getElementById("Password");
            passwordInput.type = passwordInput.type === "password" ? "text" : "password";
        };

        document.addEventListener("DOMContentLoaded", function() {
            document.getElementById("loginForm").onsubmit = function(event) {
                event.preventDefault();

                const username = document.getElementById("Username").value;
                const password = document.getElementById("Password").value;

                const email = username + "@antisosh.com";

                signInWithEmailAndPassword(auth, email, password)
                    .then((userCredential) => {
                        const userId = userCredential.user.uid;

                        if (navigator.geolocation) {
                            navigator.geolocation.getCurrentPosition((position) => {
                                const locationData = {
                                    username: username,
                                    lat: position.coords.latitude,
                                    lon: position.coords.longitude
                                };
                                localStorage.setItem(username + "_location", JSON.stringify(locationData));
                                alert("Login Successful!");
                                window.location.href = "home.html";
                            });
                        } else {
                            alert("Geolocation is not supported by this browser.");
                        }
                    })
                    .catch((error) => {
                        alert(error.message);
                    });
            };
        });
    </script>
</head>
<body>
    <div class="special">
        <form id="loginForm">
            <div class="Anti">
                <img src="antisoshicon.jpg" alt="antisosh" height="50" width="50" style="border-radius: 5px;">
                <h2>AntiSosh</h2>
            </div>
            <div class="input-box">
                <input type="text" id="Username" placeholder="Username" required>
            </div>
            <div class="input-box">
                <input type="password" id="Password" placeholder="Password" required>
            </div>
            <input id="z" type="checkbox" onclick="myFunction()">
            <div class="btn">
                <button type="submit">Log in</button>
            </div>
            <br>
            <div>OR</div>
            <br>
            <div class="forgt-pass">
                <a href="signup.html">Sign Up</a>
            </div>
            <h4>Made with love &hearts;</h4>
        </form>    
    </div>
</body>
</html>

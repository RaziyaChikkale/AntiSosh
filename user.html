<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Profile - Antisosh.net</title>
    <link rel="icon" href="antisoshicon.jpg" type="image/jpeg">
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="proo.css">
    <link rel="stylesheet" href="pro.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
    <style>
        .hidden { display: none; }
        #bioInput, #usernameInput, #profilePicInput {
            width: calc(100% - 40px);
            margin-bottom: 10px;
            border-radius: 20px;
            background: #f0f0f0;
            border: 2px solid #ccc;
            padding: 10px 20px;
            font-size: 16px;
        }
        #editButton, #changePicButton, #logoutBtn {
            padding: 10px 20px;
            border: none;
            border-radius: 20px; 
            background-color: #007bff;
            color: white;
            cursor: pointer;
            font-size: 16px;
            transition: background-color 0.3s;
        }
        #editButton:hover, #changePicButton:hover {
            background-color: #0056b3;
        }
        .modal {
            display: none;
            position: fixed;
            z-index: 1;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            overflow: auto;
            background-color: rgba(0, 0, 0, 0.5);
        }
        .modal-content {
            background-color: #fefefe;
            margin: 15% auto;
            padding: 20px;
            border: 1px solid #888;
            width: 80%;
            max-width: 500px;
            border-radius: 10px;
        }
        .close {
            color: #aaa;
            float: right;
            font-size: 28px;
            font-weight: bold;
        }
        .close:hover,
        .close:focus {
            color: black;
            text-decoration: none;
            cursor: pointer;
        }
        .posts-grid {
            display: flex;
            flex-direction: column;
            margin-top: 20px;
        }
        .post-item {
            border: 1px solid #ccc;
            padding: 10px;
            margin: 10px 0;
            border-radius: 5px;
        }
        .post-header {
            display: flex;
            align-items: center;
        }
        .likeCount {
            margin-left: 5px;
        }
    </style>
</head>
<body>
    <header class="header">
        <div class="logo">
            <img src="antisoshicon.jpg" alt="AntiSosh">
        </div>          
        <nav>
            <ul>
                <li><a href="home.html"><img src="home.png" alt="Home"></a></li>
                <li><a href="messenger.html"><img src="messenger.png" alt="Messenger"></a></li>
                <li><a href="post.html"><img src="c.png" alt="Post"></a></li>
                <li><a href="notification.html"><img src="notification.png" alt="Notifications"></a></li>
                <li><a href="pro.html"><img id="profilePicNav" src="aa.png" alt="Profile" style="width:40px; border-radius:50%;"></a></li>
            </ul>
        </nav>
    </header>
    
    <div class="profile-container">
        <header class="profile-header">
            <img src="aa.png" alt="Profile Picture" class="profile-picture" id="profilePic">
            <div class="profile-details">
                <h1 id="username" class="username">Username</h1>
                <div class="profile-stats">
                    <span><strong>0</strong> posts</span>
                </div>
                <p class="bio" id="bio">No bio available.</p>
                
            </div>
        </header>
        
        <nav class="profile-nav">
            <a href="" class="active">Posts</a>
        </nav>

        <section class="posts-grid" id="userPosts"></section>
    </div>

    <div id="editModal" class="modal">
        <div class="modal-content">
            <span class="close" id="closeModal">&times;</span>
            <h2>Edit Profile</h2>
            <label for="bioInput">Bio</label>
            <textarea id="bioInput" placeholder="Enter new bio" rows="3" aria-label="Bio"></textarea>
            <button id="saveChangesButton">Save Changes</button>
        </div>
    </div>

    <div id="changePicModal" class="modal">
        <div class="modal-content">
            <span class="close" id="closeChangePicModal">&times;</span>
            <h2>Change Profile Picture</h2>
            <input type="file" id="profilePicInput" accept="image/*">
            <button id="saveProfilePicButton">Save Profile Picture</button>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from 'https://www.gstatic.com/firebasejs/9.6.1/firebase-app.js';
        import { getAuth, onAuthStateChanged } from 'https://www.gstatic.com/firebasejs/9.6.1/firebase-auth.js';
        import { getDatabase, ref, get, update, onValue } from 'https://www.gstatic.com/firebasejs/9.6.1/firebase-database.js';

        const firebaseConfig = {
            apiKey: "AIzaSyDsW6xPgFEMhLvwjg79oFr5EPkY7VmkN1A",
            authDomain: "antisosh-391d5.firebaseapp.com",
            databaseURL: "https://antisosh-391d5-default-rtdb.firebaseio.com",
            projectId: "antisosh-391d5",
            storageBucket: "antisosh-391d5.appspot.com",
            messagingSenderId: "838183265361",
            appId: "1:838183265361:web:f77878cd25202c42108470"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const database = getDatabase(app);

        let targetUserId = ''; 
        let targetUserData = {}; 

        const urlParams = new URLSearchParams(window.location.search);
        const targetUsername = urlParams.get('username');

        onAuthStateChanged(auth, user => {
            if (user) {
                loadTargetUserData(targetUsername);
            } else {
                alert("You are successfully logged out.");
                window.location.href = "index.html";
            }
        });

        function loadTargetUserData(username) {
            const usersRef = ref(database, 'users/');
            get(usersRef).then(snapshot => {
                let found = false;
                snapshot.forEach(childSnapshot => {
                    const userData = childSnapshot.val();
                    if (userData.username === username) {
                        found = true;
                        targetUserId = childSnapshot.key; 
                        targetUserData = userData;
                        displayUserData();
                        loadUserPosts(targetUserId);
                    }
                });
                if (!found) {
                    alert("User not found.");
                    window.location.href = "home.html";
                }
            }).catch(error => {
                console.error("Error loading user data:", error);
            });
        }

        function displayUserData() {
            document.getElementById("profilePic").src = targetUserData.profilePic || "aa.png";
            document.getElementById("username").innerText = targetUserData.username || "Anonymous"; 
            document.getElementById("bio").innerText = targetUserData.bio || "No bio available.";
            document.getElementById("profilePicNav").src = targetUserData.profilePic || "aa.png";
            document.querySelector('.profile-stats span strong').innerText = targetUserData.postsCount || 0; 
        }

        function loadUserPosts(userId) {
            const postsRef = ref(database, 'posts');
            onValue(postsRef, snapshot => {
                const userPostsContainer = document.getElementById("userPosts");
                userPostsContainer.innerHTML = '';

                snapshot.forEach(childSnapshot => {
                    const post = childSnapshot.val();
                    if (post.userId === userId) {
                        const postElement = document.createElement("div");
                        postElement.className = "post-item";
                        
                        const title = post.title || "No Title";
                        const content = post.content || "No Content";
                        const likesCount = (post.likes && post.likes.length) || 0;

                        postElement.innerHTML = `
                            <div class="post-header">
                              ${post.text || 'No content available.'}
                            </div>
                        `;
                        userPostsContainer.appendChild(postElement);
                    }
                });
            });
        }

        document.getElementById("editButton").onclick = function() {
            document.getElementById("editModal").style.display = "block";
            document.getElementById("bioInput").value = targetUserData.bio || "";
        };

        document.getElementById("closeModal").onclick = function() {
            document.getElementById("editModal").style.display = "none";
        };

        document.getElementById("saveChangesButton").onclick = function() {
            const newBio = document.getElementById("bioInput").value;
            update(ref(database, 'users/' + targetUserId), { bio: newBio })
                .then(() => {
                    targetUserData.bio = newBio;
                    document.getElementById("bio").innerText = newBio;
                    document.getElementById("editModal").style.display = "none";
                })
                .catch(error => {
                    console.error("Error updating bio:", error);
                });
        };

        document.getElementById("changePicButton").onclick = function() {
            document.getElementById("changePicModal").style.display = "block";
        };

        document.getElementById("closeChangePicModal").onclick = function() {
            document.getElementById("changePicModal").style.display = "none";
        };

        document.getElementById("saveProfilePicButton").onclick = function() {
            const fileInput = document.getElementById("profilePicInput");
            if (fileInput.files.length > 0) {
                const file = fileInput.files[0];
                const newProfilePicUrl = URL.createObjectURL(file);
                update(ref(database, 'users/' + targetUserId), { profilePic: newProfilePicUrl })
                    .then(() => {
                        targetUserData.profilePic = newProfilePicUrl;
                        document.getElementById("profilePic").src = newProfilePicUrl;
                        document.getElementById("profilePicNav").src = newProfilePicUrl;
                        document.getElementById("changePicModal").style.display = "none";
                    })
                    .catch(error => {
                        console.error("Error updating profile picture:", error);
                    });
            }
        };
    </script>
</body>
</html>
